apiVersion: apps/v1
kind: Deployment
metadata:
  name: p14-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: p14-web
  template:
    metadata:
      labels:
        app: p14-web
    spec:
      containers:
        - name: p14-web
          image: IMAGE_URI
          imagePullPolicy: Always
          ports:
            - containerPort: 80
